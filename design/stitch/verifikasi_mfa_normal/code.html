<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Masuk - Pantau Media</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            canvas: '#F3F5F9',
            surface: '#FFFFFF',
            sunken: '#F7F8FB',
            line: '#E6E9F0',
            control: '#8C95A8',
            'ink-900': '#0F1729',
            'ink-700': '#3B4559',
            'ink-600': '#566075',
            'ink-500': '#6B7488',
            'primary-50': '#EEF3FF',
            'primary-600': '#2457E6',
            'primary-700': '#1B45C2',
            'neg-text': '#C2262E',
            'neg-tint': '#FDECEC',
          },
          borderRadius: {
            'sm': '10px',
            'xl': '28px',
          },
          boxShadow: {
            'card': '0 1px 2px rgb(15 23 41 / 0.04), 0 2px 8px -2px rgb(15 23 41 / 0.04)',
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #F3F5F9;
      color: #0F1729;
    }
  </style>
<meta content="web_blank" name="shell-type"/></head>
<body class="min-h-screen bg-[#F3F5F9] flex flex-col items-center justify-center p-6 selection:bg-[#EEF3FF] selection:text-[#2457E6]">
<!-- Main Container -->
<main class="w-full max-w-[420px] flex flex-col items-center"><div class="flex flex-col w-full items-center">
<div class="w-full bg-surface rounded-xl p-[40px] shadow-card flex flex-col items-center">
<!-- Header Identitas Pantau Media -->
<div class="flex items-center gap-3 self-start">
<div class="w-10 h-10 rounded-sm bg-primary-600 flex items-center justify-center text-surface shadow-sm">
<span class="material-symbols-outlined text-[22px]">radar</span>
</div>
<div class="flex flex-col text-left">
<span class="text-[16px] leading-[20px] font-bold text-ink-900 tracking-tight font-headline-xl">Pantau Media</span>
<span class="font-label-xs text-label-xs text-ink-600">Platform Monitoring &amp; OSINT</span>
</div>
</div>
<!-- Judul & Deskripsi -->
<div class="w-full mt-[24px] text-left">
<h1 class="font-headline-xl text-[24px] leading-[32px] font-bold text-ink-900 tracking-[-0.01em]">
        Verifikasi dua langkah
      </h1>
<p class="font-body-base text-body-base text-ink-600 mt-[8px]">
        Masukkan kode 6 digit dari aplikasi autentikator Anda.
      </p>
</div>
<!-- 6-Digit OTP Form -->
<form autocomplete="off" class="w-full mt-[28px]" id="otp-form" onsubmit="return false;">
<div class="flex items-center justify-between gap-[8px] w-full" id="otp-container">
<input aria-label="Digit 1" autofocus="" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-primary-600 shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-border-control focus:border-primary-600 focus:shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-border-control focus:border-primary-600 focus:shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-border-control focus:border-primary-600 focus:shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-border-control focus:border-primary-600 focus:shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="4" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="otp-digit w-[48px] h-[56px] rounded-sm text-center font-bold text-[24px] text-ink-900 bg-surface tabular-nums outline-none transition-all duration-150 border-[1.5px] border-border-control focus:border-primary-600 focus:shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]" data-index="5" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Status Feedback Spinner Placeholder (Hidden by default) -->
<div class="hidden flex items-center justify-center gap-2 mt-4 text-primary-600" id="verifying-status">
<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
<span class="font-body-sm text-body-sm">Memverifikasi kredensial...</span>
</div>
</form>
<!-- Tautan Gunakan Perangkat Lain -->
<a class="mt-[24px] font-body-base-medium text-body-base-medium text-primary-600 hover:underline cursor-pointer transition-colors focus:outline-none" href="#other-device">
      Gunakan perangkat lain
    </a>
</div>
<!-- Footer Metadata Keamanan di Luar Kartu -->
<p class="font-label-xs text-label-xs text-ink-500 text-center mt-[24px]">
    Akses hanya melalui jaringan instansi (VPN/LAN)
  </p>
<script>
    (function initOTP() {
      const inputs = document.querySelectorAll('.otp-digit');
      const statusEl = document.getElementById('verifying-status');

      function syncRings() {
        inputs.forEach((input) => {
          if (document.activeElement === input) {
            input.classList.remove('border-border-control');
            input.classList.add('border-primary-600', 'shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]');
          } else {
            input.classList.remove('border-primary-600', 'shadow-[0_0_0_2px_#FFFFFF,0_0_0_4px_#2457E6]');
            input.classList.add('border-border-control');
          }
        });
      }

      inputs.forEach((input, index) => {
        input.addEventListener('focus', () => {
          syncRings();
        });

        input.addEventListener('blur', () => {
          setTimeout(syncRings, 10);
        });

        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = val ? val[val.length - 1] : '';

          if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          // Check if all filled
          const fullOtp = Array.from(inputs).map((inp) => inp.value).join('');
          if (fullOtp.length === 6) {
            if (statusEl) {
              statusEl.classList.remove('hidden');
            }
            inputs.forEach(inp => inp.setAttribute('disabled', 'true'));
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
          if (!pasteData) return;

          for (let i = 0; i < inputs.length; i++) {
            if (i < pasteData.length) {
              inputs[i].value = pasteData[i];
            }
          }

          const targetFocus = Math.min(pasteData.length, inputs.length - 1);
          inputs[targetFocus].focus();

          const fullOtp = Array.from(inputs).map((inp) => inp.value).join('');
          if (fullOtp.length === 6) {
            if (statusEl) {
              statusEl.classList.remove('hidden');
            }
            inputs.forEach(inp => inp.setAttribute('disabled', 'true'));
          }
        });
      });
    })();
  </script>
</div></main>
</body></html>
